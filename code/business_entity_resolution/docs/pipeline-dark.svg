<rect x="150" y="370" width="5" height="110" rx="2" fill="#b08ae8"/>
<text x="166" y="395" font-size="14.5" font-weight="700" fill="#e6edf3">Domain adaptation</text>
<text x="166" y="416" font-size="12" font-weight="400" fill="#9aa7b4">2 × multilingual-e5-base</text>
<text x="166" y="433" font-size="12" font-weight="400" fill="#9aa7b4">self-trained on French</text>
<text x="166" y="450" font-size="12" font-weight="400" fill="#9aa7b4">test records: pseudo-labels</text>
<text x="166" y="467" font-size="12" font-weight="400" fill="#9aa7b4">+ synthetic negatives</text>
<rect x="408" y="370" width="236" height="110" rx="10" fill="#33260f" stroke="#e0a040" stroke-width="1.6"/>
<rect x="408" y="370" width="5" height="110" rx="2" fill="#e0a040"/>
<text x="424" y="395" font-size="14.5" font-weight="700" fill="#e6edf3">Stacking</text>
<text x="424" y="416" font-size="12" font-weight="400" fill="#9aa7b4">same meta-model, with the</text>
<text x="424" y="433" font-size="12" font-weight="400" fill="#9aa7b4">French cross-encoders in</text>
<text x="424" y="450" font-size="12" font-weight="400" fill="#9aa7b4">the re-ranker&#x27;s place</text>
<rect x="666" y="370" width="236" height="110" rx="10" fill="#16301a" stroke="#6cc466" stroke-width="1.6"/>
<rect x="666" y="370" width="5" height="110" rx="2" fill="#6cc466"/>
