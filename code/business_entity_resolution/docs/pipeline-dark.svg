<text x="580.0" y="190" font-size="12.5" text-anchor="middle" fill="#e6edf3">Uncertain pairs (0.02 ≤ p ≤ 0.98, ~1.5 M test pairs) go to a transformer re-ranker · confident pairs keep their score</text>
<path d="M1035.0,130 L1035.0,165" fill="none" stroke="#6b7785" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="20" y="224" width="894" height="126" rx="12" fill="#161c24"/>
<text x="34" y="292.0" font-size="15" font-weight="700" fill="#b7c2cd">US / India</text>
<rect x="20" y="362" width="894" height="126" rx="12" fill="#161c24"/>
<text x="34" y="430.0" font-size="15" font-weight="700" fill="#b7c2cd">France</text>
