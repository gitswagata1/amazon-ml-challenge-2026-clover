<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="1160" height="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7785"/></marker></defs>
<rect width="1160" height="560" fill="#0d1117"/>
<rect x="20" y="30" width="206" height="100" rx="10" fill="#1c2430" stroke="#7d8da1" stroke-width="1.6"/>
