<text x="682" y="416" font-size="12" font-weight="400" fill="#9aa7b4">one-to-one assignment</text>
<text x="682" y="433" font-size="12" font-weight="400" fill="#9aa7b4">threshold 0.91</text>
<text x="682" y="450" font-size="12" font-weight="400" fill="#9aa7b4">look-alike rules</text>
<text x="682" y="467" font-size="12" font-weight="400" fill="#9aa7b4">noise-word recovery</text>
