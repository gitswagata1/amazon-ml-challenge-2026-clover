<rect x="150" y="232" width="5" height="110" rx="2" fill="#b08ae8"/>
<text x="166" y="257" font-size="14.5" font-weight="700" fill="#e6edf3">Cross-encoder re-ranker</text>
<text x="166" y="278" font-size="12" font-weight="400" fill="#9aa7b4">multilingual-e5-base · 278 M</text>
<text x="166" y="295" font-size="12" font-weight="400" fill="#9aa7b4">fine-tuned, 2-fold</text>
<text x="166" y="312" font-size="12" font-weight="400" fill="#9aa7b4">reads both records together</text>
<rect x="408" y="232" width="236" height="110" rx="10" fill="#33260f" stroke="#e0a040" stroke-width="1.6"/>
<rect x="408" y="232" width="5" height="110" rx="2" fill="#e0a040"/>
<text x="424" y="257" font-size="14.5" font-weight="700" fill="#e6edf3">Stacking</text>
<text x="424" y="278" font-size="12" font-weight="400" fill="#9aa7b4">LightGBM meta-model:</text>
<text x="424" y="295" font-size="12" font-weight="400" fill="#9aa7b4">combines classifier and</text>
<text x="424" y="312" font-size="12" font-weight="400" fill="#9aa7b4">re-ranker scores</text>
<text x="424" y="329" font-size="12" font-weight="700" fill="#e6edf3">CV 0.98876</text>
<rect x="666" y="232" width="236" height="110" rx="10" fill="#16301a" stroke="#6cc466" stroke-width="1.6"/>
<rect x="666" y="232" width="5" height="110" rx="2" fill="#6cc466"/>
<text x="682" y="257" font-size="14.5" font-weight="700" fill="#e6edf3">Post-processing</text>
<text x="682" y="278" font-size="12" font-weight="400" fill="#9aa7b4">one-to-one assignment</text>
<text x="682" y="295" font-size="12" font-weight="400" fill="#9aa7b4">threshold 0.58</text>
<text x="682" y="312" font-size="12" font-weight="400" fill="#9aa7b4">ambiguity rejection</text>
<text x="682" y="329" font-size="12" font-weight="700" fill="#e6edf3">CV 0.98921</text>
