<rect x="150" y="232" width="5" height="110" rx="2" fill="#7a4bc2"/>
<text x="166" y="257" font-size="14.5" font-weight="700" fill="#1b2530">Cross-encoder re-ranker</text>
<text x="166" y="278" font-size="12" font-weight="400" fill="#556270">multilingual-e5-base · 278 M</text>
<text x="166" y="295" font-size="12" font-weight="400" fill="#556270">fine-tuned, 2-fold</text>
<text x="166" y="312" font-size="12" font-weight="400" fill="#556270">reads both records together</text>
<rect x="408" y="232" width="236" height="110" rx="10" fill="#fdf1dc" stroke="#c07a12" stroke-width="1.6"/>
<rect x="408" y="232" width="5" height="110" rx="2" fill="#c07a12"/>
<text x="424" y="257" font-size="14.5" font-weight="700" fill="#1b2530">Stacking</text>
<text x="424" y="278" font-size="12" font-weight="400" fill="#556270">LightGBM meta-model:</text>
<text x="424" y="295" font-size="12" font-weight="400" fill="#556270">combines classifier and</text>
<text x="424" y="312" font-size="12" font-weight="400" fill="#556270">re-ranker scores</text>
<text x="424" y="329" font-size="12" font-weight="700" fill="#1b2530">CV 0.98876</text>
<rect x="666" y="232" width="236" height="110" rx="10" fill="#e6f3e4" stroke="#3f8a3a" stroke-width="1.6"/>
<rect x="666" y="232" width="5" height="110" rx="2" fill="#3f8a3a"/>
<text x="682" y="257" font-size="14.5" font-weight="700" fill="#1b2530">Post-processing</text>
<text x="682" y="278" font-size="12" font-weight="400" fill="#556270">one-to-one assignment</text>
<text x="682" y="295" font-size="12" font-weight="400" fill="#556270">threshold 0.58</text>
<text x="682" y="312" font-size="12" font-weight="400" fill="#556270">ambiguity rejection</text>
<text x="682" y="329" font-size="12" font-weight="700" fill="#1b2530">CV 0.98921</text>
