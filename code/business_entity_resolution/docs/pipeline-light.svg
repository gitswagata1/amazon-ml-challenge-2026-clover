<rect x="150" y="370" width="5" height="110" rx="2" fill="#7a4bc2"/>
<text x="166" y="395" font-size="14.5" font-weight="700" fill="#1b2530">Domain adaptation</text>
<text x="166" y="416" font-size="12" font-weight="400" fill="#556270">2 × multilingual-e5-base</text>
<text x="166" y="433" font-size="12" font-weight="400" fill="#556270">self-trained on French</text>
<text x="166" y="450" font-size="12" font-weight="400" fill="#556270">test records: pseudo-labels</text>
<text x="166" y="467" font-size="12" font-weight="400" fill="#556270">+ synthetic negatives</text>
<rect x="408" y="370" width="236" height="110" rx="10" fill="#fdf1dc" stroke="#c07a12" stroke-width="1.6"/>
<rect x="408" y="370" width="5" height="110" rx="2" fill="#c07a12"/>
<text x="424" y="395" font-size="14.5" font-weight="700" fill="#1b2530">Stacking</text>
<text x="424" y="416" font-size="12" font-weight="400" fill="#556270">same meta-model, with the</text>
<text x="424" y="433" font-size="12" font-weight="400" fill="#556270">French cross-encoders in</text>
<text x="424" y="450" font-size="12" font-weight="400" fill="#556270">the re-ranker&#x27;s place</text>
<rect x="666" y="370" width="236" height="110" rx="10" fill="#e6f3e4" stroke="#3f8a3a" stroke-width="1.6"/>
<rect x="666" y="370" width="5" height="110" rx="2" fill="#3f8a3a"/>
<text x="682" y="395" font-size="14.5" font-weight="700" fill="#1b2530">Post-processing</text>
<text x="682" y="416" font-size="12" font-weight="400" fill="#556270">one-to-one assignment</text>
<text x="682" y="433" font-size="12" font-weight="400" fill="#556270">threshold 0.91</text>
<text x="682" y="450" font-size="12" font-weight="400" fill="#556270">look-alike rules</text>
<text x="682" y="467" font-size="12" font-weight="400" fill="#556270">noise-word recovery</text>
