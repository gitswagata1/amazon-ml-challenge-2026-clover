<text x="36" y="55" font-size="14.5" font-weight="700" fill="#1b2530">Data</text>
<text x="36" y="76" font-size="12" font-weight="400" fill="#556270">Source 1 / 2 / 3 records</text>
<text x="36" y="93" font-size="12" font-weight="400" fill="#556270">train 2.2 M + 10.3 M</text>
<text x="36" y="110" font-size="12" font-weight="400" fill="#556270">test 1.7 M + 10 M</text>
<rect x="248" y="30" width="206" height="100" rx="10" fill="#eef1f5" stroke="#7d8da1" stroke-width="1.6"/>
<rect x="248" y="30" width="5" height="100" rx="2" fill="#7d8da1"/>
<text x="264" y="55" font-size="14.5" font-weight="700" fill="#1b2530">Preprocessing</text>
<text x="264" y="76" font-size="12" font-weight="400" fill="#556270">transliteration</text>
<text x="264" y="93" font-size="12" font-weight="400" fill="#556270">abbreviations, legal forms</text>
<text x="264" y="110" font-size="12" font-weight="400" fill="#556270">house-number keys</text>
<rect x="476" y="30" width="206" height="100" rx="10" fill="#e3f4f1" stroke="#1f8a7a" stroke-width="1.6"/>
<rect x="476" y="30" width="5" height="100" rx="2" fill="#1f8a7a"/>
<text x="492" y="55" font-size="14.5" font-weight="700" fill="#1b2530">Candidate generation</text>
<text x="492" y="76" font-size="12" font-weight="400" fill="#556270">keys + fuzzy re-rank</text>
<text x="492" y="93" font-size="12" font-weight="400" fill="#556270">e5 kNN + dense retriever</text>
<text x="492" y="110" font-size="12" font-weight="700" fill="#1b2530">~25 per S1 · recall 99.2 %</text>
<rect x="704" y="30" width="206" height="100" rx="10" fill="#fdf1dc" stroke="#c07a12" stroke-width="1.6"/>
<rect x="704" y="30" width="5" height="100" rx="2" fill="#c07a12"/>
<text x="720" y="55" font-size="14.5" font-weight="700" fill="#1b2530">Feature engineering</text>
<text x="720" y="76" font-size="12" font-weight="400" fill="#556270">~53 features: string,</text>
<text x="720" y="93" font-size="12" font-weight="400" fill="#556270">address, name rarity,</text>
<text x="720" y="110" font-size="12" font-weight="400" fill="#556270">e5 + cross-encoder scores</text>
<rect x="932" y="30" width="206" height="100" rx="10" fill="#fdf1dc" stroke="#c07a12" stroke-width="1.6"/>
<rect x="932" y="30" width="5" height="100" rx="2" fill="#c07a12"/>
<text x="948" y="55" font-size="14.5" font-weight="700" fill="#1b2530">LightGBM classifier</text>
<text x="948" y="76" font-size="12" font-weight="400" fill="#556270">gradient boosting · Optuna</text>
<text x="948" y="93" font-size="12" font-weight="400" fill="#556270">5-fold CV · 3-seed ensemble</text>
<text x="948" y="110" font-size="12" font-weight="700" fill="#1b2530">CV 0.98802</text>
