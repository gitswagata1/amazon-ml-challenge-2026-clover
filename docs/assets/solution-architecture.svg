<text x="716" y="255" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">2</text>
<text x="748" y="256" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1E3535">Shortlist</text>
<text x="708" y="302" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373">IDF keys → pool of 1,500</text>
<text x="708" y="334" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373">→ fuzzy re-rank, keep top 20</text>
<text x="708" y="366" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373">+ rescue rule</text>
<text x="708" y="398" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373">+ e5 neighbours (top 5)</text>
<text x="708" y="430" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373">+ tuned retriever (top 10)</text>
<text x="708" y="462" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373">+ rare-name rule</text>
<text x="708" y="494" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373"></text>
<text x="708" y="526" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E3535">43.9 M pairs, ~25 each</text>
<text x="708" y="558" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E3535">99.2 % candidate recall</text>
<g filter="url(#sh)"><rect x="1060" y="200" width="330" height="440" rx="20" fill="#FFFFFF" stroke="#E3EDED" stroke-width="2"/></g>
<rect x="1060" y="200" width="330" height="10" rx="5" fill="#F28F3B"/>
<circle cx="1096" cy="247" r="20" fill="#F28F3B"/>
<text x="1096" y="255" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1E3535">3</text>
<text x="1128" y="256" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1E3535">Judge</text>
<text x="1088" y="302" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373">~53 features per pair</text>
<text x="1088" y="334" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373">fuzzy · TF-IDF · postcode</text>
<text x="1088" y="366" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373">house no. · name rarity</text>
<text x="1088" y="398" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373">e5 cosines · small CE</text>
<text x="1088" y="430" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373"></text>
<text x="1088" y="462" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373">LightGBM, Optuna-tuned</text>
<text x="1088" y="494" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373">5-fold GroupKFold</text>
<text x="1088" y="526" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373">3 seeds averaged</text>
<text x="1088" y="558" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E3535">→ probability 0–1</text>
