<text x="88" y="334" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373">1.73 M businesses</text>
<text x="88" y="366" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373">clean reference</text>
<text x="88" y="398" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373"></text>
<text x="88" y="430" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E3535">Sources 2 + 3</text>
<text x="88" y="462" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373">9.97 M noisy</text>
<text x="88" y="494" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373">records</text>
<text x="88" y="526" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373"></text>
