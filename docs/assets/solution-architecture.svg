<rect x="60" y="200" width="250" height="10" rx="5" fill="#FFD5C2"/>
<text x="88" y="256" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1E3535">Inputs</text>
