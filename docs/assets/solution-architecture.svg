<rect x="0" y="0" width="2240" height="980" rx="28" fill="#FFFCFA"/>
<text x="60" y="78" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#1E3535">Solution architecture</text>
<text x="60" y="118" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#5A7373">Shortlist → judge → re-read the uncertain → decide · per country, no external data</text>
