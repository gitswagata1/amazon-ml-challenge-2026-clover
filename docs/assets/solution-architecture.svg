<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2240 980" width="2240" height="980" role="img" aria-label="Solution architecture: preprocess, candidate generation, LightGBM matcher, cross-encoder re-ranking with a separate France path, and the decision layer">
