<text x="386" y="255" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">1</text>
<text x="418" y="256" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1E3535">Preprocess</text>
<text x="378" y="302" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373">Transliterate</text>
<text x="378" y="334" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373">9 Indic scripts</text>
<text x="378" y="366" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373">Mined script</text>
<text x="378" y="398" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373">dictionary (5,484)</text>
<text x="378" y="430" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373">Expand abbreviations</text>
<text x="378" y="462" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373">Strip legal forms</text>
<text x="378" y="494" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373">Consonant skeletons</text>
<text x="378" y="526" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20"  fill="#5A7373">House-number keys</text>
